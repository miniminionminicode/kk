- name: Push JSON to private repo
  env:
    PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
    PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  run: |
    set -e

    # ===============================
    # SKIP PUSH IF GLOBAL OUTAGE
    # ===============================
    if [ -f SKIP_PUSH ]; then
      echo "Global outage detected — skipping push."
      exit 0
    fi

    # ensure JSON exists and not empty
    if [ ! -s master_courses.json ]; then
      echo "master_courses.json missing or empty — skipping push."
      exit 0
    fi

    git config --global user.name "Automated"
    git config --global user.email "actions@users.noreply.github.com"

    git clone "https://x-access-token:${PUSH_TOKEN}@github.com/${PRIVATE_REPO}.git" private-data

    cp master_courses.json private-data/master_courses.json

    cd private-data
    git add master_courses.json
    git commit -m "Update master_courses.json: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || exit 0
    git push
